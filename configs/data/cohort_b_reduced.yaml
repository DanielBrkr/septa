name: "cohort_b_debug"
debug: True
save_on_data_generation: True

metadata:
  timestamp: ${now:%Y-%m-%d}

directories:
  cohort: ${hydra:runtime.cwd}/datasets/sepsis_type_b_cohort

paths:
  static: datasets/sepsis_type_b_cohort/static/2024-06-23/dataset_static.parquet
  unsplitted: raw/2024-07-17/dataset_ts_cleaned.parquet
  splitted: splitted
  scaled: scaled
  indexed: indexed

  df_train: datasets/sepsis_type_b_cohort/indexed/2024-07-17/df_train_indexed_polars.parquet
  df_val: datasets/sepsis_type_b_cohort/indexed/2024-07-17/df_val_indexed_polars.parquet
  df_test: datasets/sepsis_type_b_cohort/indexed/2024-07-17/df_test_indexed_polars.parquet


imputation_strategy: "median"
assumed_sepsis_prevalence: 0.1 # float
sample_idx_column: "sample_idx_6_h"
# leave empty if you want to take every available features
# (all available columns if subset_training is empty else subset training) - auxillary - target - ignored_columns = used features
considered_feature_subset_generation:
considered_feature_subset_training: [ "temperature", "sao2","heartrate","respiration", "noninvasivesystolic", "st1", "st2", "st3" ]
#considered_feature_subset_training:
target_column: "sepsis_present"
ignored_columns: [ "heartrate" ]
auxillary_columns: [ "patientunitstayid",  "sepsis_patient", "time_offset", "sample_idx_6_h" ]


considered_features_static_cat: [ "gender", "ethnicity", "diabetes", "immunosuppression" ]
considered_features_static_num: [ "admissionheight"]
