name: "dataset_cleanup"

defaults:
  - /cohort: sepsis_type_b
  - _self_
directories:
  data_save_dir: dataset_cleaned

paths:
#  dataset_raw: merged_tables/${data.cohort.name}/2024-07-24/merged_tables_ts.parquet
  dataset_raw: dataset/${data.cohort.name}/2024-08-02/dataset_ts.parquet
#  sepsis_labels: outcome_labels/sepsis/2024-06-22/sepsis_labels_concise_1h_6h_168h.parquet

cleanup:
