  hiexhmvlimit: "High Exhaled Minute Volume Limit"
  lowexhtvlimit: "Low Exhaled Tidal Volume Limit"
  hipeakpreslimit: "High Peak Pressure Limit"
  lowpeakpreslimit: "Low Peak Pressure Limit"
  hirespratelimit: "High Respiratory Rate Limit"
  lowrespratelimit: "Low Respiratory Rate Limit"
  sighpreslimit: "Sigh Pressure Limit"
