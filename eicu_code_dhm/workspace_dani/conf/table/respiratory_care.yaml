# _16 denotes the data override down to Int/Float16 where applicable
# Int/Float are nullable versions of int/float in pandas, which we need
table_name: "respiratorycare"
table_name_pretty: "Respiratory Care" # "variables" is already included in the title
file_name: "respiratory_care"
file_suffix: "regular"
time_offset_name: "respcarestatusoffset"
time_delta_column: "time_delta_respiratory_care"

paths:
  table_location: intermediary_data/tables_basis/2024-05-27/respiratory_care_regular.parquet

metadata:
  na_equivalent_value: ""

# I'd say that float-type don't have to be set right away, the new ABCD SQL does usually a good job
# of inferring the dtype
data_type_overrides:
  airwaytype: string
  airwaysize: string
  airwayposition: string
  apneaparams: string
  setapneainterval: string
  setapneatv: string
  setapneaippeephigh: string
  setapnearr: string
  setapneapeakflow: string
  setapneainsptime: string
  setapneaie: string
  setapneafio2: string


# when either lists are empty -> keeping all columns
dropping_columns: True
columns_to_drop: [ ]
columns_to_keep: [ patientunitstayid,respcareid,respcarestatusoffset,currenthistoryseqnum,airwaytype,ventstartoffset,ventendoffset,priorventstartoffset,priorventendoffset ]

variable_units:
  respcareid: ""
  patientunitstayid: ""
  respcarestatusoffset: "Minutes"
  currenthistoryseqnum: ""
  airwaytype: ""
  airwaysize: "mm"
  airwayposition: ""
  cuffpressure: "cmH2O" #?
  ventstartoffset: "Minutes"
  ventendoffset: "Minutes"
  priorventstartoffset: "Minutes"
  priorventendoffset: "Minutes"
  apneaparams: ""
  lowexhmvlimit: "L/min"
  hiexhmvlimit: "L/min"
  lowexhtvlimit: "mL"
  hipeakpreslimit: "cmH2O"
  lowpeakpreslimit: "cmH2O"
  hirespratelimit: "bpm"
  lowrespratelimit: "bpm"
  sighpreslimit: "cmH2O"
  lowironoxlimit: "percentage"
  highironoxlimit: "percentage"
  meanairwaypreslimit: "cmH2O"
  peeplimit: "cmH2O"
  cpaplimit: "cmH2O"
  setapneainterval: "seconds"
  setapneatv: "mL"
  setapneaippeephigh: "cmH2O"
  setapnearr: "ratio"
  setapneapeakflow: "L/min"
  setapneainsptime: "seconds"
  setapneaie: "ratio"
  setapneafio2: "percentage"

variables_pretty:
  respcareid: "Respiratory Care ID"
  patientunitstayid: "Patient Unit Stay ID"
  respcarestatusoffset: "Respiratory Care Status Offset"
  currenthistoryseqnum: "Current History Sequence Number"
