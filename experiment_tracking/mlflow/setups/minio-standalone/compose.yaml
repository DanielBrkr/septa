# docker compose --env-file ./minio_config.env up
name: "mlflow-minio"
version: "3.9"
services:
  minio:
    restart: unless-stopped
    image: minio/minio:RELEASE.2024-02-26T09-33-48Z
    container_name: standalone-minio
    hostname: minio-standalone
    volumes:
      - ./mlflow-minio-data:/data
    networks:
      - mlflow-shared-network
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ADDRESS=${MINIO_ADDRESS}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_STORAGE_USE_HTTPS=${MINIO_STORAGE_USE_HTTPS}
      - MINIO_CONSOLE_ADDRESS=${MINIO_CONSOLE_ADDRESS}
    command: server /data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9010/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 12G
        reservations:
          cpus: "2"
          memory: 4G


  nginx:
    image: nginx:1.19.2-alpine
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mlflow-shared-network
    ports:
      - "9010:9000"
      - "9011:9001"
    depends_on:
      - minio
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

networks:
  mlflow-shared-network:
    external: True