# start with:
# docker-compose --env-file ./mlflow_minio_config.env -f compose.yaml up
version: "3.4"
services:
  minio:
    restart: unless-stopped
    image: minio/minio:RELEASE.2024-02-26T09-33-48Z
    container_name: standalone-minio
    hostname: minio-standalone
    volumes:
      - /home/daniel/NAS/experiment-tracking/mlflow/mlflow-minio-data:/data
    networks:
      - mlflow-shared-network
   # env_file:
   #   - ./mlflow_minio_config.env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ADDRESS=${MINIO_ADDRESS}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_STORAGE_USE_HTTPS=${MINIO_STORAGE_USE_HTTPS}
      - MINIO_CONSOLE_ADDRESS=${MINIO_CONSOLE_ADDRESS}
    command: server /data
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 12G
        reservations:
          cpus: "2"
          memory: 4G


  nginx:
    image: nginx:1.19.2-alpine
    hostname: nginx-minio
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mlflow-shared-network
    ports:
      - "9020:9010"
      - "9021:9011"
    depends_on:
      - minio
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

networks:
  mlflow-shared-network:
    external: True